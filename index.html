
<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Živex – Digitalni letak</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #17442b;
  background: radial-gradient(
    ellipse at center,
    #ffffff 0%,
    #edf5d9 55%,
    #b7d77a 100%
  );
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 22px 12px 10px;
}

h2 {
  margin: 0 0 8px;
  font-size: 24px;
}

.viewer {
  max-width: 1100px;
  margin: 10px auto;
  padding: 20px;
  text-align: center;
}

.book {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 400px;
  perspective: 1800px;
}

.page {
  display: block;
  max-width: 100%;
  max-height: 72vh;
  width: auto;
  height: auto;
  background: white;
  box-shadow: 0 12px 35px #0003;
  border-radius: 4px;
  transition: transform .3s ease;
}

.page.turn {
  transform: rotateY(-12deg) scale(.97);
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}

button {
  background: #087b36;
  color: white;
  border: none;
  padding: 12px 17px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #075b2b;
}

button:disabled {
  opacity: .4;
  cursor: default;
}

.counter {
  padding: 12px;
  font-weight: bold;
}

#status {
  font-size: 13px;
  margin-top: 15px;
}

.viewer:fullscreen {
  background: #edf5d9;
  overflow: auto;
}

@media (max-width: 600px) {
  h2 { font-size: 19px; }
  .viewer { padding: 10px; }
  button { padding: 10px 12px; }
  .book { min-height: 250px; }
}
</style>
</head>

<body>

<header>
  <h2>ŽIVKOVA OGRAJENA PONUDBA</h2>
  <div>Prelistajte aktualni Živex letak</div>
</header>

<main class="viewer" id="viewer">

  <div class="book">
    <canvas id="page" class="page"></canvas>
  </div>

  <div class="controls">
    <button id="prev">❮ Nazaj</button>
    <span class="counter" id="counter">1 / ...</span>
    <button id="next">Naprej ❯</button>
    <button id="sound">🔊 Zvok: vklopljen</button>
    <button id="fullscreen">⛶ Cel zaslon</button>
  </div>

  <div id="status">Nalagam letak ...</div>

</main>

<script type="module">
import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const canvas = document.getElementById("page");
const ctx = canvas.getContext("2d");
const counter = document.getElementById("counter");
const status = document.getElementById("status");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const sound = document.getElementById("sound");

let pdf = null;
let current = 1;
let busy = false;
let soundOn = true;
let audioContext;

function playSound() {
  if (!soundOn) return;

  try {
    audioContext ||= new AudioContext();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "triangle";

    oscillator.frequency.setValueAtTime(
      350, audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      180, audioContext.currentTime + .09
    );

    gain.gain.setValueAtTime(
      .035, audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001, audioContext.currentTime + .1
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + .1);
  } catch (e) {}
}

async function renderPage(number) {
  if (!pdf || busy) return;

  busy = true;
  prev.disabled = true;
  next.disabled = true;

  canvas.classList.add("turn");

  try {
    const page = await pdf.getPage(number);
    const base = page.getViewport({ scale: 1 });

    const availableWidth = Math.min(
      950,
      window.innerWidth - 35
    );

    const scale = Math.min(
      2,
      availableWidth / base.width,
      (window.innerHeight * .72) / base.height
    );

    const viewport = page.getViewport({ scale });
    const dpr = Math.min(
      window.devicePixelRatio || 1, 2
    );

    canvas.width = Math.floor(viewport.width * dpr);
    canvas.height = Math.floor(viewport.height * dpr);

    canvas.style.width = viewport.width + "px";
    canvas.style.height = viewport.height + "px";

    await page.render({
      canvasContext: ctx,
      viewport,
      transform: [dpr, 0, 0, dpr, 0, 0]
    }).promise;

    current = number;

    counter.textContent =
      current + " / " + pdf.numPages;

    status.textContent =
      "Strani lahko obračate tudi s puščicami na tipkovnici.";

  } catch (error) {
    status.textContent =
      "Napaka pri prikazu strani: " + error.message;
  } finally {
    busy = false;
    prev.disabled = current === 1;
    next.disabled = current === pdf.numPages;
    canvas.classList.remove("turn");
  }
}

async function changePage(delta) {
  if (busy || !pdf) return;

  const target = current + delta;

  if (target < 1 || target > pdf.numPages) return;

  playSound();
  await renderPage(target);
}

prev.onclick = () => changePage(-1);
next.onclick = () => changePage(1);

sound.onclick = () => {
  soundOn = !soundOn;

  sound.textContent = soundOn
    ? "🔊 Zvok: vklopljen"
    : "🔇 Zvok: izklopljen";
};

document.getElementById("fullscreen").onclick = () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.getElementById("viewer").requestFullscreen();
  }
};

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") changePage(1);
  if (event.key === "ArrowLeft") changePage(-1);
});

let touchX = 0;

canvas.addEventListener("touchstart", e => {
  touchX = e.changedTouches[0].screenX;
}, { passive: true });

canvas.addEventListener("touchend", e => {
  const diff =
    e.changedTouches[0].screenX - touchX;

  if (Math.abs(diff) > 60) {
    changePage(diff < 0 ? 1 : -1);
  }
}, { passive: true });

async function loadPDF() {
  try {
    const response = await fetch(
      "letak.pdf",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error(
        "Datoteke letak.pdf ni mogoče najti."
      );
    }

    const data = await response.arrayBuffer();

    pdf = await pdfjsLib.getDocument({
      data
    }).promise;

    await renderPage(1);

  } catch (error) {
    status.textContent =
      "Napaka: " + error.message;
  }
}

loadPDF();
</script>

</body>
</html>
